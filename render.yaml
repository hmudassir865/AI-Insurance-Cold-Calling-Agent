services:
  - type: postgresql
    name: insurance-db
    plan: free
    region: frankfurt
    ipAllowList: []

  - type: web
    name: insurance-backend
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: insurance-db
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: SIGNALWIRE_SPACE
        sync: false
      - key: SIGNALWIRE_PROJECT_ID
        sync: false
      - key: SIGNALWIRE_AUTH_TOKEN
        sync: false
      - key: SIGNALWIRE_PHONE_NUMBER
        sync: false
      - key: SIGNALWIRE_WEBHOOK_BASE_URL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: LLM_FALLBACK_ENABLED
        value: "true"

  - type: static
    name: insurance-frontend
    region: frankfurt
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://insurance-backend.onrender.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
