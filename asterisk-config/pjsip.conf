[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0

[6001]
type=endpoint
context=internal
disallow=all
allow=ulaw
auth=6001
aors=6001

[6001]
type=auth
auth_type=userpass
password=test123
username=6001

[6001]
type=aor
max_contacts=1
remove_existing=yes

[ai-agent]
type=endpoint
context=internal
disallow=all
allow=ulaw
auth=ai-agent
aors=ai-agent

[ai-agent]
type=auth
auth_type=userpass
password=agent123
username=ai-agent

[ai-agent]
type=aor
max_contacts=1
